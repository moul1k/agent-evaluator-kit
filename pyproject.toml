[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluator-kit"
version = "0.1.0"
description = "Portable agent evaluation, judge auditing, and independent human review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
langfuse = ["langfuse>=4.17,<5"]
openai = ["openai>=1.50,<3"]
interop = ["openai-agents==0.20.0", "langgraph==1.2.20", "langchain-openai==1.7.4", "smolagents[openai]==1.26.0"]
dev = ["pytest>=8", "ruff>=0.6", "build"]

[project.scripts]
agent-eval = "agent_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
